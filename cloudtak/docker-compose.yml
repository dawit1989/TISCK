services:
  # ============================================================================
  # CloudTAK API & Web Interface (Node.js + Vue.js)
  # ============================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgis:
        condition: service_healthy
      media:
        condition: service_started
    ports:
      - "0.0.0.0:${API_PORT:-5000}:5000"
    env_file:
      - path: .env
        required: false
      - path: .env.identity
        required: false
    environment:
      - CLOUDTAK_Mode=${CLOUDTAK_Mode:-docker-compose}
      - CLOUDTAK_Server_Mode=${CLOUDTAK_Server_Mode:-both}
      - CLOUDTAK_Hub_URL=${CLOUDTAK_Hub_URL}
      - HUB_RPC_PORT=${HUB_RPC_PORT:-5002}
      - CLOUDTAK_Config_media_url=${CLOUDTAK_Config_media_url:-http://media}
      - SigningSecret=${SigningSecret}
      # Database
      - POSTGRES=${POSTGRES:-postgres://docker:docker@postgis:5432/gis}
      # URLs
      - API_URL=${API_URL:-http://localhost:5000}
      - PMTILES_URL=${PMTILES_URL:-http://tiles:5002}
      # S3 / Garage Object Storage
      - ASSET_BUCKET=${ASSET_BUCKET:-cloudtak}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_S3_Endpoint=${AWS_S3_Endpoint}
      - AWS_S3_AccessKeyId=${AWS_S3_AccessKeyId}
      - AWS_S3_SecretAccessKey=${AWS_S3_SecretAccessKey}
      - AWS_S3_ForcePathStyle=${AWS_S3_ForcePathStyle:-true}
      - AWS_EC2_METADATA_DISABLED=true
      # OIDC Authentication
      - OIDC_ENABLED=${OIDC_ENABLED:-true}
      - OIDC_FORCED=${OIDC_FORCED:-false}
      - OIDC_DISCOVERY_URL=${OIDC_DISCOVERY_URL:-http://identity-server:9000/application/o/cloudtak/.well-known/openid-configuration}
      - OIDC_AUTHORIZATION_URL=${OIDC_AUTHORIZATION_URL:-http://localhost:9000/application/o/authorize/}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-cloudtak}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET}
      - OIDC_SCOPES=${OIDC_SCOPES:-openid profile email groups}
      - OIDC_REDIRECT_URI=${OIDC_REDIRECT_URI:-http://localhost:5000/api/login/oidc/callback}
      - OIDC_ISSUER=${OIDC_ISSUER:-http://localhost:9000/application/o/cloudtak/}
      - LOCAL_ONLY_ACCOUNTS=${LOCAL_ONLY_ACCOUNTS:-admin}
      # Authentik Integration
      - AUTHENTIK_HOST=${AUTHENTIK_HOST:-http://localhost:9000}
      - AUTHENTIK_URL=${AUTHENTIK_URL:-http://identity-server:9000}
      - AUTHENTIK_APP_SLUG=${AUTHENTIK_APP_SLUG:-cloudtak}
      - AUTHENTIK_API_TOKEN=${AUTHENTIK_API_TOKEN}
      - SYNC_AUTHENTIK_ATTRIBUTES_ON_LOGIN=${SYNC_AUTHENTIK_ATTRIBUTES_ON_LOGIN:-true}
      # Tactical Group Names
      - CLOUDTAK_Config_group_Blue=${CLOUDTAK_Config_group_Blue:-Joint Operations Command}
      - CLOUDTAK_Config_group_Red=${CLOUDTAK_Config_group_Red:-Tactical Response Unit}
      - CLOUDTAK_Config_group_Yellow=${CLOUDTAK_Config_group_Yellow:-Medical & CASEVAC}
      - CLOUDTAK_Config_group_White=${CLOUDTAK_Config_group_White:-Emergency Relief}
      - CLOUDTAK_Config_group_Purple=${CLOUDTAK_Config_group_Purple:-Command & Staff}
      - CLOUDTAK_Config_group_Brown=${CLOUDTAK_Config_group_Brown:-Ground Defense}
      - CLOUDTAK_Config_group_Maroon=${CLOUDTAK_Config_group_Maroon:-Field Hospital}
      - CLOUDTAK_Config_group_Orange=${CLOUDTAK_Config_group_Orange:-Search & Rescue (SAR)}
      - CLOUDTAK_Config_group_Teal=${CLOUDTAK_Config_group_Teal:-Maritime & Riverine}
      - CLOUDTAK_Config_group_Green=${CLOUDTAK_Config_group_Green:-Border Security}
      - CLOUDTAK_Config_group_Cyan=${CLOUDTAK_Config_group_Cyan:-Communications & Logistics}
      - CLOUDTAK_Config_group_Dark_Blue=${CLOUDTAK_Config_group_Dark_Blue:-Intelligence & Recon}
      # Custom Group Placeholders (extendable)
      - CLOUDTAK_Config_group_Custom1=${CLOUDTAK_Config_group_Custom1:-}
      - CLOUDTAK_Config_group_Custom2=${CLOUDTAK_Config_group_Custom2:-}
      # Map & Display Defaults
      - CLOUDTAK_Config_map_center=${CLOUDTAK_Config_map_center:-38.7578,9.0222}
      - CLOUDTAK_Config_map_zoom=${CLOUDTAK_Config_map_zoom:-6}
      - CLOUDTAK_Config_map_pitch=${CLOUDTAK_Config_map_pitch:-0}
      - CLOUDTAK_Config_map_bearing=${CLOUDTAK_Config_map_bearing:-0}
      - CLOUDTAK_Config_display_distance=${CLOUDTAK_Config_display_distance:-kilometer}
      - CLOUDTAK_Config_display_elevation=${CLOUDTAK_Config_display_elevation:-meter}
      - CLOUDTAK_Config_display_speed=${CLOUDTAK_Config_display_speed:-km/h}
      - CLOUDTAK_Config_display_projection=${CLOUDTAK_Config_display_projection:-mercator}
    networks:
      - cloudtak-net

  # ============================================================================
  # PMTiles Vector / Raster Tile Service
  # ============================================================================
  tiles:
    build:
      context: .
      dockerfile: ./tasks/pmtiles/Dockerfile.compose
    restart: unless-stopped
    ports:
      - "0.0.0.0:${TILES_PORT:-5002}:5002"
    environment:
      - PMTILES_URL=${PMTILES_URL:-http://tiles:5002}
      - SigningSecret=${SigningSecret}
      - ASSET_BUCKET=${ASSET_BUCKET:-cloudtak}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_S3_Endpoint=${AWS_S3_Endpoint}
      - AWS_S3_AccessKeyId=${AWS_S3_AccessKeyId}
      - AWS_S3_SecretAccessKey=${AWS_S3_SecretAccessKey}
      - AWS_S3_ForcePathStyle=${AWS_S3_ForcePathStyle:-true}
      - AWS_EC2_METADATA_DISABLED=true
    networks:
      - cloudtak-net

  # ============================================================================
  # ETL: Events Processing Worker
  # ============================================================================
  events:
    build:
      context: .
      dockerfile: ./tasks/events/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      - CLOUDTAK_Mode=${CLOUDTAK_Mode:-docker-compose}
      - API_URL=${API_URL:-http://api:5000}
      - SigningSecret=${SigningSecret}
      - ASSET_BUCKET=${ASSET_BUCKET:-cloudtak}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_S3_Endpoint=${AWS_S3_Endpoint}
      - AWS_S3_AccessKeyId=${AWS_S3_AccessKeyId}
      - AWS_S3_SecretAccessKey=${AWS_S3_SecretAccessKey}
      - AWS_S3_ForcePathStyle=${AWS_S3_ForcePathStyle:-true}
      - AWS_EC2_METADATA_DISABLED=true
    networks:
      - cloudtak-net

  # ============================================================================
  # ETL: Data Retention & Cleanup Worker
  # ============================================================================
  retention:
    build:
      context: .
      dockerfile: ./tasks/retention/Dockerfile.compose
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
      postgis:
        condition: service_healthy
    environment:
      - CLOUDTAK_Mode=${CLOUDTAK_Mode:-docker-compose}
      - API_URL=${API_URL:-http://api:5000}
      - ASSET_BUCKET=${ASSET_BUCKET:-cloudtak}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_S3_Endpoint=${AWS_S3_Endpoint}
      - AWS_S3_AccessKeyId=${AWS_S3_AccessKeyId}
      - AWS_S3_SecretAccessKey=${AWS_S3_SecretAccessKey}
      - AWS_S3_ForcePathStyle=${AWS_S3_ForcePathStyle:-true}
      - AWS_EC2_METADATA_DISABLED=true
      - SigningSecret=${SigningSecret}
      - RETENTION_SCHEDULE=${RETENTION_SCHEDULE:-0 3 * * *}
    networks:
      - cloudtak-net

  # ============================================================================
  # Media Streaming Service (RTSP / RTMP / HLS / WebRTC)
  # ============================================================================
  media:
    image: bluenviron/mediamtx:1.11.3-ffmpeg
    restart: unless-stopped
    environment:
      - API_URL=${API_URL:-http://api:5000}
      - SigningSecret=${SigningSecret}
      - MTX_API=yes
      - MTX_APIADDRESS=:9997
      - MTX_LOGLEVEL=${MEDIAMTX_LOGLEVEL:-info}
      - MTX_AUTHINTERNALUSERS=[{"user":"any","permissions":[{"action":"publish"},{"action":"read"},{"action":"playback"},{"action":"api"},{"action":"metrics"}]}]
      - CLOUDTAK_Config_media_url=${CLOUDTAK_Config_media_url:-http://media}
    ports:
      - "127.0.0.1:${MEDIA_PORT_API:-9997}:9997"
      - "0.0.0.0:${MEDIA_PORT_RTSP:-8554}:8554"
      - "0.0.0.0:${MEDIA_PORT_RTMP:-1935}:1935"
      - "0.0.0.0:${MEDIA_PORT_HLS:-8888}:8888"
      - "0.0.0.0:${MEDIA_PORT_WEBRTC:-8889}:8889"
      - "0.0.0.0:${MEDIA_PORT_SRT:-8890}:8890"
    networks:
      - cloudtak-net

  # ============================================================================
  # Garage S3-Compatible Distributed Object Store
  # ============================================================================
  store:
    image: dxflrs/garage:v2.4.1
    restart: unless-stopped
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    ports:
      - "127.0.0.1:${GARAGE_S3_PORT:-3900}:3900"
      - "127.0.0.1:${GARAGE_WEB_PORT:-3902}:3902"
      - "127.0.0.1:${GARAGE_ADMIN_PORT:-3903}:3903"
    environment:
      - RUST_LOG=info
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cloudtak-net

  # ============================================================================
  # Local PostgreSQL 17 with PostGIS
  # ============================================================================
  postgis:
    image: postgis/postgis:17-3.4-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-gis}
      - POSTGRES_USER=${POSTGRES_USER:-docker}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-docker}
    volumes:
      - postgis-data:/var/lib/postgresql/data
      - ./scripts/init-authentik-db.sql:/docker-entrypoint-initdb.d/02-authentik.sql:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docker} -d ${POSTGRES_DB:-gis}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cloudtak-net

  # ============================================================================
  # Identity: Redis Cache & Celery Task Broker (Authentik)
  # ============================================================================
  identity-cache:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cloudtak-net
    volumes:
      - identity-cache-data:/data

  # ============================================================================
  # Identity: Authentik Core Server (Web / API / OIDC Provider)
  # ============================================================================
  identity-server:
    image: ghcr.io/goauthentik/server:2024.12.3
    restart: unless-stopped
    command: server
    depends_on:
      postgis:
        condition: service_healthy
      identity-cache:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
      - path: .env.identity
        required: false
    environment:
      - AUTHENTIK_SECRET_KEY=${AUTHENTIK_SECRET_KEY}
      - AUTHENTIK_BOOTSTRAP_PASSWORD=${AUTHENTIK_BOOTSTRAP_PASSWORD:-admin}
      - AUTHENTIK_BOOTSTRAP_TOKEN=${AUTHENTIK_BOOTSTRAP_TOKEN}
      - AUTHENTIK_REDIS__HOST=identity-cache
      - AUTHENTIK_POSTGRESQL__HOST=${AUTHENTIK_POSTGRESQL__HOST:-postgis}
      - AUTHENTIK_POSTGRESQL__NAME=${AUTHENTIK_POSTGRESQL__NAME:-authentik}
      - AUTHENTIK_POSTGRESQL__USER=${AUTHENTIK_POSTGRESQL__USER:-authentik}
      - AUTHENTIK_POSTGRESQL__PASSWORD=${AUTHENTIK_POSTGRESQL__PASSWORD:-authentik}
      - AUTHENTIK_DISABLE_UPDATE_CHECK=true
      - AUTHENTIK_DISABLE_STARTUP_ANALYTICS=true
      - AUTHENTIK_ERROR_REPORTING__ENABLED=false
      - AUTHENTIK_HOST=${AUTHENTIK_HOST:-http://localhost:9000}
      - AUTHENTIK_LOG_LEVEL=${AUTHENTIK_LOG_LEVEL:-info}
    volumes:
      - authentik-media:/media
      - authentik-templates:/templates
    ports:
      - "127.0.0.1:${AUTHENTIK_PORT_HTTP:-9000}:9000"
    healthcheck:
      test: ["CMD-SHELL", "ak healthcheck || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 45s
    networks:
      - cloudtak-net

  # ============================================================================
  # Identity: Authentik Celery Task Worker
  # ============================================================================
  identity-worker:
    image: ghcr.io/goauthentik/server:2024.12.3
    restart: unless-stopped
    command: worker
    depends_on:
      postgis:
        condition: service_healthy
      identity-cache:
        condition: service_healthy
      identity-server:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
      - path: .env.identity
        required: false
    environment:
      - AUTHENTIK_SECRET_KEY=${AUTHENTIK_SECRET_KEY}
      - AUTHENTIK_BOOTSTRAP_PASSWORD=${AUTHENTIK_BOOTSTRAP_PASSWORD:-admin}
      - AUTHENTIK_BOOTSTRAP_TOKEN=${AUTHENTIK_BOOTSTRAP_TOKEN}
      - AUTHENTIK_REDIS__HOST=identity-cache
      - AUTHENTIK_POSTGRESQL__HOST=${AUTHENTIK_POSTGRESQL__HOST:-postgis}
      - AUTHENTIK_POSTGRESQL__NAME=${AUTHENTIK_POSTGRESQL__NAME:-authentik}
      - AUTHENTIK_POSTGRESQL__USER=${AUTHENTIK_POSTGRESQL__USER:-authentik}
      - AUTHENTIK_POSTGRESQL__PASSWORD=${AUTHENTIK_POSTGRESQL__PASSWORD:-authentik}
      - AUTHENTIK_DISABLE_UPDATE_CHECK=true
      - AUTHENTIK_DISABLE_STARTUP_ANALYTICS=true
      - AUTHENTIK_ERROR_REPORTING__ENABLED=false
      - AUTHENTIK_HOST=${AUTHENTIK_HOST:-http://localhost:9000}
      - AUTHENTIK_LOG_LEVEL=${AUTHENTIK_LOG_LEVEL:-info}
    volumes:
      - authentik-media:/media
      - authentik-templates:/templates
    networks:
      - cloudtak-net

  # ============================================================================
  # Identity: Authentik LDAP Outpost (Optional Compatibility Interface)
  # ============================================================================
  identity-ldap:
    image: ghcr.io/goauthentik/ldap:2024.12.3
    restart: unless-stopped
    profiles:
      - ldap
    depends_on:
      identity-server:
        condition: service_healthy
    env_file:
      - path: .env.identity
        required: false
    environment:
      - AUTHENTIK_HOST=http://identity-server:9000
      - AUTHENTIK_TOKEN=${AUTHENTIK_BOOTSTRAP_TOKEN:-}
      - AUTHENTIK_INSECURE=true
    ports:
      - "127.0.0.1:${AUTHENTIK_LDAP_PORT:-389}:389"
      - "127.0.0.1:${AUTHENTIK_LDAPS_PORT:-636}:636"
    networks:
      - cloudtak-net

volumes:
  postgis-data:
    driver: local
  garage-meta:
    driver: local
  garage-data:
    driver: local
  identity-cache-data:
    driver: local
  authentik-media:
    driver: local
  authentik-templates:
    driver: local

networks:
  cloudtak-net:
    driver: bridge
