services:
  # ============================================================================
  # Dedicated TAK Database (PostgreSQL 17 + PostGIS)
  # ============================================================================
  tak-db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    shm_size: 256m
    command: postgres -c max_connections=200 -c shared_buffers=256MB
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-takserver}
      POSTGRES_USER: ${POSTGRES_USER:-tak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atakatak}
    volumes:
      - tak-db-data:/var/lib/postgresql/data
      - ./conf/init-tak-db.sql:/docker-entrypoint-initdb.d/init-tak-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tak} -d ${POSTGRES_DB:-takserver}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - tak-net

  # ============================================================================
  # Official TAK Server 5.6
  # ============================================================================
  tak-server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      tak-db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      - HostedDomain=${HostedDomain:-localhost}
      - TAK_VERSION=${TAK_VERSION:-takserver-docker-5.7-RELEASE-43}
      - StackName=${StackName:-TAKServer}
      - COUNTRY=${COUNTRY:-US}
      - STATE=${STATE:-VA}
      - CITY=${CITY:-Quantico}
      - ORGANIZATION=${ORGANIZATION:-TISCK}
      - ORGANIZATIONAL_UNIT=${ORGANIZATIONAL_UNIT:-Tactical Operations}
      - CAPASS=${CAPASS:-atakatak}
      - PASS=${PASS:-atakatak}
      # Database
      - POSTGRES_HOST=${POSTGRES_HOST:-tak-db}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-takserver}
      - POSTGRES_USER=${POSTGRES_USER:-tak}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-atakatak}
      - PostgresUsername=${POSTGRES_USER:-tak}
      - PostgresPassword=${POSTGRES_PASSWORD:-atakatak}
      - PostgresURL=${PostgresURL:-}
      # Garage S3 Integration
      - S3_ENABLED=${S3_ENABLED:-true}
      - AWS_S3_Endpoint=${AWS_S3_Endpoint:-http://store:3900}
      - S3_BUCKET=${S3_BUCKET:-tak-server}
      - AWS_S3_AccessKeyId=${AWS_S3_AccessKeyId:-cloudtak-key}
      - AWS_S3_SecretAccessKey=${AWS_S3_SecretAccessKey:-}
      - AWS_REGION=${AWS_REGION:-garage}
      - AWS_S3_ForcePathStyle=${AWS_S3_ForcePathStyle:-true}
      - AWS_EC2_METADATA_DISABLED=true
      # Authentik LDAP Integration
      - LDAP_ENABLED=${LDAP_ENABLED:-true}
      - LDAP_HOST=${LDAP_HOST:-identity-ldap}
      - LDAP_PORT=${LDAP_PORT:-389}
      - LDAP_SECURE_URL=${LDAP_SECURE_URL:-ldap://identity-ldap:389}
      - LDAP_DN=${LDAP_DN:-dc=ldap,dc=goauthentik,dc=io}
      - LDAP_SERVICE_USER=${LDAP_SERVICE_USER:-cn=akadmin,ou=users,dc=ldap,dc=goauthentik,dc=io}
      - LDAP_SERVICE_USER_PASSWORD=${LDAP_SERVICE_USER_PASSWORD:-}
      # TLS
      - ENABLE_LETSENCRYPT=${ENABLE_LETSENCRYPT:-false}
    ports:
      - "0.0.0.0:${TAK_COT_PORT:-8089}:8089"
      - "0.0.0.0:${TAK_WEB_PORT:-8443}:8443"
      - "0.0.0.0:${TAK_CERT_PORT:-8446}:8446"
    volumes:
      - tak-certs:/opt/tak/certs
      - tak-data:/opt/tak/data
    networks:
      - tak-net
      - cloudtak-net

networks:
  tak-net:
    driver: bridge
  cloudtak-net:
    name: cloudtak_cloudtak-net
    external: true

volumes:
  tak-db-data:
    driver: local
  tak-certs:
    driver: local
  tak-data:
    driver: local
